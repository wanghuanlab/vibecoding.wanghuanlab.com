  - generic [ref=e23]: 传统编码 vs VibeCoding 对比 传统编码范式 核心载体： 键盘手动输入每一行代码 / 语法 思维瓶颈： 死记 API 参数、框架规范与配置 排错方式： 肉眼调试、查 StackOverflow / 文档 角色定位： 产出代码的“苦力工人” 交付速度： 受限于打字速度与检索记忆成本 VibeCoding 新范式 核心载体： 自然语言 Prompt + 上下文工程驱动 思维瓶颈： 需求拆解能力、架构设计与审查能力 排错方式： 错误日志自动喂给 AI 快速迭代修复 角色定位： 意图表达者 (Director) + 代码审查者 (Reviewer) 交付速度： 意图理解即生成，效率提升 3-10 倍