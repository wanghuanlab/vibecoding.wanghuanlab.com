<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" style="background:#f7f0dc; font-family:'Inter', 'PingFang SC', sans-serif;">
  <style>
    .card { fill:#fff9e9; stroke:#1c1b17; stroke-width:2; rx:8; }
    .doc-header { fill:#1c1b17; fill-text:#ffffff; rx:6; }
    .box-blue { fill:#e8f4f8; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-orange { fill:#fff4e6; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-green { fill:#b9dec5; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-purple { fill:#e8c7dd; stroke:#1c1b17; stroke-width:2; rx:6; }
    .chip { fill:#ffffff; stroke:#1c1b17; stroke-width:1.5; rx:12; font-size:11px; font-weight:700; fill-text:#1c1b17; }
    .arrow { stroke:#1c1b17; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1c1b17" />
    </marker>
  </defs>

  <!-- Left Doc: refactor-overview.md -->
  <rect x="30" y="30" width="400" height="390" class="card" />
  <rect x="45" y="45" width="370" height="36" class="doc-header" />
  <text x="60" y="68" font-size="15" font-weight="900" fill="#ffffff">📄 refactor-overview.md (项目总览文件)</text>

  <g transform="translate(50, 95)">
    <!-- Section 1 -->
    <text x="0" y="20" font-size="14" font-weight="900" fill="#527c9e">1. 项目定义 (Project Definition)</text>
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="65" height="26" class="chip" /><text x="32.5" y="17" text-anchor="middle">项目背景</text>
      <rect x="75" y="0" width="65" height="26" class="chip" /><text x="107.5" y="17" text-anchor="middle">重构目标</text>
      <rect x="150" y="0" width="65" height="26" class="chip" /><text x="182.5" y="17" text-anchor="middle">范围边界</text>
      <rect x="225" y="0" width="65" height="26" class="chip" style="fill:#f3b1a2;" /><text x="257.5" y="17" text-anchor="middle">关键约束</text>
    </g>

    <!-- Section 2 -->
    <text x="0" y="90" font-size="14" font-weight="900" fill="#9b6e9e">2. 过程产物链接 (Artifact Links)</text>
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="65" height="26" class="chip" /><text x="32.5" y="17" text-anchor="middle">静态扫描</text>
      <rect x="75" y="0" width="65" height="26" class="chip" /><text x="107.5" y="17" text-anchor="middle">系统架构</text>
      <rect x="150" y="0" width="65" height="26" class="chip" /><text x="182.5" y="17" text-anchor="middle">方案文档</text>
      <rect x="225" y="0" width="65" height="26" class="chip" /><text x="257.5" y="17" text-anchor="middle">验证报告</text>
    </g>

    <!-- Section 3 -->
    <text x="0" y="160" font-size="14" font-weight="900" fill="#e86652">3. 执行状态源 (Execution State)</text>
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="80" height="26" class="chip" style="fill:#f5d363;" /><text x="40" y="17" text-anchor="middle">Task Graph</text>
      <rect x="90" y="0" width="95" height="26" class="chip" /><text x="137.5" y="17" text-anchor="middle">Task 执行列表</text>
      <rect x="195" y="0" width="70" height="26" class="chip" /><text x="230" y="17" text-anchor="middle">当前进度</text>
      <rect x="0" y="34" width="65" height="26" class="chip" style="fill:#f3b1a2;" /><text x="32.5" y="51" text-anchor="middle">阻塞点</text>
      <rect x="75" y="34" width="80" height="26" class="chip" style="fill:#b9dec5;" /><text x="115" y="51" text-anchor="middle">下一步动作</text>
    </g>
  </g>

  <!-- Center Arrow Engine -->
  <path d="M 430 225 L 485 225" class="arrow" />

  <circle cx="530" cy="225" r="45" fill="#ffffff" stroke="#1c1b17" stroke-width="2.5" />
  <text x="530" y="215" font-size="14" font-weight="900" text-anchor="middle" fill="#1c1b17">项目执行引擎</text>
  <text x="530" y="233" font-size="11" fill="#625f54" text-anchor="middle">读取进度</text>
  <text x="530" y="247" font-size="11" fill="#625f54" text-anchor="middle">找到下个 Task</text>

  <path d="M 575 225 L 630 225" class="arrow" />

  <!-- Right Cycle Panel: 自动化推进 Loop -->
  <rect x="630" y="30" width="340" height="390" class="box-orange" />
  <text x="650" y="65" font-size="18" font-weight="900" fill="#e86652">按项目进度持续推进</text>

  <g transform="translate(655, 85)">
    <!-- Loop Box 1 -->
    <rect x="0" y="0" width="140" height="45" class="box-green" />
    <text x="70" y="27" font-size="13" font-weight="900" text-anchor="middle">1. 选择下一个 Task</text>

    <path d="M 140 22.5 L 175 22.5" class="arrow" />

    <!-- Loop Box 2 -->
    <rect x="175" y="0" width="135" height="45" class="box-blue" />
    <text x="242.5" y="20" font-size="12" font-weight="900" text-anchor="middle">2. Harness + Loop</text>
    <text x="242.5" y="35" font-size="11" text-anchor="middle" fill="#444">自动执行与验证</text>

    <path d="M 242.5 45 L 242.5 80" class="arrow" />

    <!-- Center Badge: 跨会话可恢复 -->
    <rect x="50" y="65" width="100" height="26" class="chip" style="fill:#f5d363; stroke-dasharray:3,3;" />
    <text x="100" y="82" font-size="11" font-weight="800" text-anchor="middle">跨会话可恢复</text>

    <!-- Loop Box 3 -->
    <rect x="175" y="80" width="135" height="45" class="box-purple" />
    <text x="242.5" y="100" font-size="12" font-weight="900" text-anchor="middle">3. 生成产物 / Evidence</text>
    <text x="242.5" y="115" font-size="11" text-anchor="middle" fill="#444">单测 / Diff / 报告</text>

    <path d="M 175 102.5 L 140 102.5" class="arrow" />

    <!-- Loop Box 4 -->
    <rect x="0" y="80" width="140" height="45" class="box-gold" />
    <text x="70" y="107" font-size="13" font-weight="900" text-anchor="middle">4. 更新项目进度</text>

    <path d="M 70 80 L 70 45" class="arrow" />
  </g>

  <!-- Bottom Banner -->
  <rect x="655" y="255" width="290" height="135" class="card" style="fill:#ffffff;" />
  <text x="670" y="285" font-size="13" font-weight="900" fill="#1c1b17">💡 状态源驱动的优势：</text>
  <text x="670" y="310" font-size="12" fill="#444">• 每个 Task 独立闭环并写回总览</text>
  <text x="670" y="330" font-size="12" fill="#444">• 上下文防丢失，新 Session 秒恢复</text>
  <text x="670" y="350" font-size="12" fill="#444">• 进度全透明，团队复盘证据完整</text>
</svg>