<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" style="background:#f7f0dc; font-family:'Inter', 'PingFang SC', sans-serif;">
  <style>
    .card { fill:#fff9e9; stroke:#1c1b17; stroke-width:2; rx:8; }
    .badge { fill:#1c1b17; fill-text:#ffffff; rx:4; }
    .box-blue { fill:#e8f4f8; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-purple { fill:#f3e8f4; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-orange { fill:#fff4e6; stroke:#1c1b17; stroke-width:2; rx:6; }
    .chip { fill:#ffffff; stroke:#1c1b17; stroke-width:1.5; rx:12; font-size:12px; font-weight:700; fill-text:#1c1b17; }
    .title { font-size:18px; font-weight:900; fill:#1c1b17; }
    .num { font-size:12px; font-weight:900; fill:#ffffff; }
  </style>

  <!-- Left Card: Task Spec 6大要素 -->
  <rect x="30" y="30" width="430" height="400" class="card" />
  <rect x="50" y="48" width="120" height="28" class="badge" />
  <text x="110" y="67" font-size="14" font-weight="900" text-anchor="middle" fill="#ffffff">Task Spec</text>
  <text x="180" y="67" font-size="13" font-weight="800" fill="#625f54">可执行任务规格书 6 大要素</text>

  <g transform="translate(50, 95)">
    <!-- Item 1 -->
    <circle cx="15" cy="15" r="12" fill="#527c9e" /><text x="15" y="19" text-anchor="middle" class="num">01</text>
    <text x="38" y="20" font-size="14" font-weight="900" fill="#1c1b17">做什么</text>
    <text x="130" y="20" font-size="12" fill="#444">目标、交付物、成功状态</text>

    <!-- Item 2 -->
    <circle cx="15" cy="65" r="12" fill="#4a9e78" /><text x="15" y="69" text-anchor="middle" class="num">02</text>
    <text x="38" y="70" font-size="14" font-weight="900" fill="#1c1b17">改哪里</text>
    <text x="130" y="70" font-size="12" fill="#444">允许修改范围、涉及模块、入口</text>

    <!-- Item 3 -->
    <circle cx="15" cy="115" r="12" fill="#e86652" /><text x="15" y="119" text-anchor="middle" class="num">03</text>
    <text x="38" y="120" font-size="14" font-weight="900" fill="#1c1b17">不改哪里</text>
    <text x="130" y="120" font-size="12" fill="#444">禁止越界区域、风险红线口径</text>

    <!-- Item 4 -->
    <circle cx="15" cy="165" r="12" fill="#9b6e9e" /><text x="15" y="169" text-anchor="middle" class="num">04</text>
    <text x="38" y="170" font-size="14" font-weight="900" fill="#1c1b17">怎么验</text>
    <text x="130" y="170" font-size="12" fill="#444">编译、单测、自动化测试、Diff</text>

    <!-- Item 5 -->
    <circle cx="15" cy="215" r="12" fill="#f8c96d" /><text x="15" y="219" text-anchor="middle" class="num">05</text>
    <text x="38" y="220" font-size="14" font-weight="900" fill="#1c1b17">失败怎么办</text>
    <text x="130" y="220" font-size="12" fill="#444">回滚方案、兜底策略、失败记录</text>

    <!-- Item 6 -->
    <circle cx="15" cy="265" r="12" fill="#527c9e" /><text x="15" y="269" text-anchor="middle" class="num">06</text>
    <text x="38" y="270" font-size="14" font-weight="900" fill="#1c1b17">什么时候停</text>
    <text x="130" y="270" font-size="12" fill="#444">停止条件、Human Gate 规则</text>
  </g>

  <!-- Right Panel: 三大防护维度 -->
  <g transform="translate(490, 30)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="480" height="100" class="box-blue" />
    <text x="20" y="35" font-size="16" font-weight="900" fill="#527c9e">维度 A. 执行输入</text>
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="65" height="28" class="chip" /><text x="32.5" y="18" text-anchor="middle" font-size="12" font-weight="700">做什么</text>
      <rect x="75" y="0" width="65" height="28" class="chip" /><text x="107.5" y="18" text-anchor="middle" font-size="12" font-weight="700">改哪里</text>
      <rect x="150" y="0" width="80" height="28" class="chip" style="fill:#f3b1a2;" /><text x="190" y="18" text-anchor="middle" font-size="12" font-weight="800">不改哪里</text>
    </g>

    <!-- Box 2 -->
    <rect x="0" y="115" width="480" height="100" class="box-purple" />
    <text x="20" y="150" font-size="16" font-weight="900" fill="#9b6e9e">维度 B. 验证标准</text>
    <g transform="translate(20, 165)">
      <rect x="0" y="0" width="65" height="28" class="chip" /><text x="32.5" y="18" text-anchor="middle" font-size="12" font-weight="700">怎么验</text>
      <rect x="75" y="0" width="80" height="28" class="chip" /><text x="115" y="18" text-anchor="middle" font-size="12" font-weight="700">Evidence</text>
      <rect x="165" y="0" width="65" height="28" class="chip" /><text x="197.5" y="18" text-anchor="middle" font-size="12" font-weight="700">Diff</text>
    </g>

    <!-- Box 3 -->
    <rect x="0" y="230" width="480" height="100" class="box-orange" />
    <text x="20" y="265" font-size="16" font-weight="900" fill="#e86652">维度 C. 风险出口</text>
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="90" height="28" class="chip" /><text x="45" y="18" text-anchor="middle" font-size="12" font-weight="700">失败怎么办</text>
      <rect x="100" y="0" width="90" height="28" class="chip" /><text x="145" y="18" text-anchor="middle" font-size="12" font-weight="700">什么时候停</text>
      <rect x="200" y="0" width="100" height="28" class="chip" style="fill:#f8c96d;" /><text x="250" y="18" text-anchor="middle" font-size="12" font-weight="900">Human Gate</text>
    </g>

    <!-- Bottom Summary Banner -->
    <rect x="0" y="345" width="480" height="55" class="card" style="fill:#f8c96d; stroke-width:2.5;" />
    <text x="240" y="378" font-size="15" font-weight="900" text-anchor="middle" fill="#1c1b17">Task Spec = 执行边界 + 验证标准 + 风险出口</text>
  </g>
</svg>