<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" style="background:#f7f0dc; font-family:'Inter', 'PingFang SC', sans-serif;">
  <style>
    .card { fill:#fff9e9; stroke:#1c1b17; stroke-width:2; rx:8; }
    .title { font-size:18px; font-weight:800; fill:#1c1b17; }
    .sub { font-size:13px; fill:#625f54; }
    .box-blue { fill:#b9d9ed; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-green { fill:#b9dec5; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-purple { fill:#e8c7dd; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-orange { fill:#f3b1a2; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-gold { fill:#f5d363; stroke:#1c1b17; stroke-width:2; rx:6; }
    .chip { fill:#ffffff; stroke:#1c1b17; stroke-width:1.5; rx:12; font-size:12px; font-weight:700; fill-text:#1c1b17; }
    .arrow { stroke:#1c1b17; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1c1b17" />
    </marker>
  </defs>

  <!-- Left Card: 第一章回顾 -->
  <rect x="30" y="30" width="380" height="380" class="card" />
  <text x="50" y="62" class="sub">回顾 · 四个工程条件</text>
  <text x="50" y="88" class="title">大型重构防翻车的四大工程条件</text>

  <g transform="translate(50, 110)">
    <!-- Grid 2x2 -->
    <rect x="0" y="0" width="160" height="120" class="box-blue" />
    <text x="15" y="30" font-size="14" font-weight="800" fill="#1c1b17">1. 目标可拆</text>
    <text x="15" y="58" font-size="12" fill="#1c1b17">拆到 Task 粒度</text>
    <text x="15" y="78" font-size="12" fill="#1c1b17">明确每一步产物</text>

    <rect x="180" y="0" width="160" height="120" class="box-green" />
    <text x="195" y="30" font-size="14" font-weight="800" fill="#1c1b17">2. 边界可控</text>
    <text x="195" y="58" font-size="12" fill="#1c1b17">限制修改范围</text>
    <text x="195" y="78" font-size="12" fill="#1c1b17">划定风险红线</text>

    <rect x="0" y="140" width="160" height="120" class="box-purple" />
    <text x="15" y="170" font-size="14" font-weight="800" fill="#1c1b17">3. 验证自动化</text>
    <text x="15" y="198" font-size="12" fill="#1c1b17">编译、测试、Diff</text>
    <text x="15" y="218" font-size="12" fill="#1c1b17">留存客观证据</text>

    <rect x="180" y="140" width="160" height="120" class="box-orange" />
    <text x="195" y="170" font-size="14" font-weight="800" fill="#1c1b17">4. 风险可止损</text>
    <text x="195" y="198" font-size="12" fill="#1c1b17">该停即停</text>
    <text x="195" y="218" font-size="12" fill="#1c1b17">关键判断升级</text>
  </g>

  <!-- Center Arrow Circle -->
  <circle cx="460" cy="220" r="35" fill="#ffffff" stroke="#1c1b17" stroke-width="2" />
  <text x="460" y="215" font-size="13" font-weight="800" text-anchor="middle" fill="#1c1b17">落成</text>
  <text x="460" y="233" font-size="13" font-weight="800" text-anchor="middle" fill="#1c1b17">系统</text>
  <path d="M 495 220 L 525 220" class="arrow" />

  <!-- Right Top Box: Harness -->
  <rect x="530" y="30" width="440" height="180" class="card" style="fill:#e8f4f8;" />
  <text x="550" y="65" font-size="22" font-weight="900" fill="#527c9e">Harness 约束系统</text>
  <text x="550" y="90" font-size="13" fill="#1c1b17">定义 AI 能在什么工程环境里行动（控制搜索空间）</text>

  <g transform="translate(550, 115)">
    <rect x="0" y="0" width="65" height="28" class="chip" /><text x="32.5" y="18" text-anchor="middle" font-size="12" font-weight="700">目标</text>
    <rect x="75" y="0" width="65" height="28" class="chip" /><text x="107.5" y="18" text-anchor="middle" font-size="12" font-weight="700">边界</text>
    <rect x="150" y="0" width="75" height="28" class="chip" /><text x="187.5" y="18" text-anchor="middle" font-size="12" font-weight="700">上下文</text>
    <rect x="235" y="0" width="65" height="28" class="chip" /><text x="267.5" y="18" text-anchor="middle" font-size="12" font-weight="700">规则</text>
    <rect x="310" y="0" width="65" height="28" class="chip" /><text x="342.5" y="18" text-anchor="middle" font-size="12" font-weight="700">工具</text>
    <rect x="0" y="38" width="90" height="28" class="chip" style="fill:#f3b1a2;" /><text x="45" y="56" text-anchor="middle" font-size="12" font-weight="700">停止条件</text>
  </g>

  <!-- Right Bottom Box: Loop -->
  <rect x="530" y="230" width="440" height="180" class="card" style="fill:#fff4e6;" />
  <text x="550" y="265" font-size="22" font-weight="900" fill="#e86652">Loop 反馈系统</text>
  <text x="550" y="290" font-size="13" fill="#1c1b17">定义 AI 每一轮如何推进、验证、重试与人工升级</text>

  <g transform="translate(550, 315)">
    <rect x="0" y="0" width="70" height="28" class="box-gold" /><text x="35" y="18" text-anchor="middle" font-size="12" font-weight="800">Plan</text>
    <text x="80" y="18" font-size="14" font-weight="800">➔</text>
    <rect x="95" y="0" width="70" height="28" class="box-gold" /><text x="130" y="18" text-anchor="middle" font-size="12" font-weight="800">Build</text>
    <text x="175" y="18" font-size="14" font-weight="800">➔</text>
    <rect x="190" y="0" width="70" height="28" class="box-gold" /><text x="225" y="18" text-anchor="middle" font-size="12" font-weight="800">Verify</text>

    <rect x="0" y="38" width="90" height="28" class="chip" /><text x="45" y="56" text-anchor="middle" font-size="12" font-weight="700">Task 推进</text>
    <rect x="100" y="38" width="105" height="28" class="chip" /><text x="152.5" y="56" text-anchor="middle" font-size="12" font-weight="700">Evidence 判断</text>
    <rect x="215" y="38" width="100" height="28" class="chip" style="fill:#f8c96d;" /><text x="265" y="56" text-anchor="middle" font-size="12" font-weight="800">Human Gate</text>
  </g>
</svg>