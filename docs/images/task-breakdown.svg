<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" style="background:#f7f0dc; font-family:'Inter', 'PingFang SC', sans-serif;">
  <style>
    .card { fill:#fff9e9; stroke:#1c1b17; stroke-width:2; rx:8; }
    .box-blue { fill:#b9d9ed; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-orange { fill:#f3b1a2; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-gold { fill:#f5d363; stroke:#1c1b17; stroke-width:2; rx:6; }
    .box-green { fill:#b9dec5; stroke:#1c1b17; stroke-width:2; rx:6; }
    .arrow { stroke:#1c1b17; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1c1b17" />
    </marker>
  </defs>

  <text x="480" y="35" font-size="20" font-weight="900" text-anchor="middle" fill="#1c1b17">大型重构任务拆解：从大目标到 AI 可稳定执行的 Task</text>

  <!-- Top Flow Header -->
  <g transform="translate(160, 60)">
    <rect x="0" y="0" width="120" height="32" class="box-blue" /><text x="60" y="21" text-anchor="middle" font-size="13" font-weight="800">🎯 重构目标</text>
    <text x="135" y="21" font-size="14" font-weight="800">➔</text>

    <rect x="155" y="0" width="120" height="32" class="box-orange" /><text x="215" y="21" text-anchor="middle" font-size="13" font-weight="800">🚩 里程碑</text>
    <text x="290" y="21" font-size="14" font-weight="800">➔</text>

    <rect x="310" y="0" width="120" height="32" class="box-gold" /><text x="370" y="21" text-anchor="middle" font-size="13" font-weight="800">🥞 阶段 (Phase)</text>
    <text x="445" y="21" font-size="14" font-weight="800">➔</text>

    <rect x="465" y="0" width="140" height="32" class="box-green" /><text x="535" y="21" text-anchor="middle" font-size="13" font-weight="800">📋 任务 (Task)</text>
  </g>

  <!-- Hierarchy Tree -->
  <g transform="translate(40, 120)">
    <!-- Level 1: 重构目标 -->
    <rect x="0" y="80" width="160" height="120" class="box-blue" />
    <text x="80" y="135" font-size="16" font-weight="900" text-anchor="middle">系统重构目标</text>
    <text x="80" y="160" font-size="11" text-anchor="middle" fill="#444">表达系统终态与价值</text>

    <!-- Branch to Milestones -->
    <path d="M 160 140 L 220 50" class="arrow" />
    <path d="M 160 140 L 220 140" class="arrow" />
    <path d="M 160 140 L 220 230" class="arrow" />

    <!-- Level 2: 里程碑 -->
    <rect x="220" y="20" width="150" height="60" class="box-orange" />
    <text x="295" y="45" font-size="14" font-weight="800" text-anchor="middle">🚩 里程碑 1</text>
    <text x="295" y="65" font-size="11" text-anchor="middle">保证行为一致</text>

    <rect x="220" y="110" width="150" height="60" class="box-orange" style="stroke-width:3;" />
    <text x="295" y="135" font-size="14" font-weight="900" text-anchor="middle">🚩 里程碑 2</text>
    <text x="295" y="155" font-size="11" text-anchor="middle">风险逐步收敛</text>

    <rect x="220" y="200" width="150" height="60" class="box-orange" />
    <text x="295" y="225" font-size="14" font-weight="800" text-anchor="middle">🚩 里程碑 3</text>
    <text x="295" y="245" font-size="11" text-anchor="middle">性能优化与收口</text>

    <!-- Branch to Phases -->
    <path d="M 370 140 L 430 100" class="arrow" />
    <path d="M 370 140 L 430 180" class="arrow" />

    <!-- Level 3: Phase -->
    <rect x="430" y="70" width="150" height="60" class="box-gold" />
    <text x="505" y="95" font-size="14" font-weight="800" text-anchor="middle">Phase 1</text>
    <text x="505" y="115" font-size="11" text-anchor="middle">共同验收目标集合</text>

    <rect x="430" y="150" width="150" height="60" class="box-gold" />
    <text x="505" y="175" font-size="14" font-weight="800" text-anchor="middle">Phase 2</text>
    <text x="505" y="195" font-size="11" text-anchor="middle">功能模块交付</text>

    <!-- Branch to Tasks -->
    <path d="M 580 100 L 640 70" class="arrow" />
    <path d="M 580 100 L 640 130" class="arrow" />

    <!-- Level 4: Task -->
    <rect x="640" y="45" width="240" height="50" class="box-green" />
    <text x="655" y="68" font-size="13" font-weight="900">📋 Task 1.1 (最小闭环)</text>
    <text x="655" y="85" font-size="11" fill="#333">单接口 / 可验证 / 可回滚</text>

    <rect x="640" y="105" width="240" height="50" class="box-green" />
    <text x="655" y="128" font-size="13" font-weight="900">📋 Task 1.2 (单元闭环)</text>
    <text x="655" y="145" font-size="11" fill="#333">逻辑收敛 / 补齐单测</text>
  </g>
</svg>